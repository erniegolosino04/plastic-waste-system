<!DOCTYPE html>
<html>
<head>
    <title>Report Plastic Waste</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-header">
        <span class="app-header-icon">&#9851;</span>
        <span class="app-header-title">EcoTrack</span>
    </div>

    <div class="page-content">
    <h1>Report Plastic Waste</h1>
    <p class="subtitle">Help track where plastic waste is accumulating.</p>

    <form action="/submit" method="POST">
        <label>Location:</label>
        <input type="text" name="location" required>

        <label>Plastic Type:</label>
        <select name="plastic_type" required>
            <option value="bottles">Bottles</option>
            <option value="sachets">Sachets</option>
            <option value="bags">Bags</option>
            <option value="straws">Straws</option>
            <option value="styrofoam">Styrofoam</option>
            <option value="other">Other</option>
        </select>

        <label>Estimated Quantity:</label>
        <select name="quantity_estimate" required>
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
        </select>

        <button type="submit">Submit Report</button>
    </form>

    <p class="nav-links"><a href="/reports">View All Reports</a> | <a href="/dashboard">View Dashboard</a></p>
    </div>
</body>
</html>

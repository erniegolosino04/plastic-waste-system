<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Plastic Waste Dashboard</h1>

    <canvas id="typeChart" width="400" height="200"></canvas>
    <canvas id="locationChart" width="400" height="200"></canvas>

    <script>
        new Chart(document.getElementById('typeChart'), {
            type: 'pie',
            data: {
                labels: {{ type_labels | tojson }},
                datasets: [{
                    data: {{ type_values | tojson }},
                    backgroundColor: ['#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f','#edc948']
                }]
            },
            options: { plugins: { title: { display: true, text: 'Reports by Plastic Type' } } }
        });

        new Chart(document.getElementById('locationChart'), {
            type: 'bar',
            data: {
                labels: {{ location_labels | tojson }},
                datasets: [{
                    label: 'Reports per Location',
                    data: {{ location_values | tojson }},
                    backgroundColor: '#4e79a7'
                }]
            },
            options: { plugins: { title: { display: true, text: 'Reports by Location (Hotspots)' } } }
        });
    </script>

    <p><a href="/">Back to Form</a></p>
</body>
</html>
